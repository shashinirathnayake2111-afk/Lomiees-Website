{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/cart.css') }}">
{% endblock %}

{% block content %}
<div class="cart-container">
    <div class="cart-header">
        <h1>Shopping Bag</h1>
        <p>Review your items before checkout</p>
    </div>

    <div class="cart-grid" id="cartGrid">
        <!-- Content will be populated by JS -->
        <div class="cart-items" id="cartItemsList">
            <div class="empty-cart">
                <i class="fas fa-shopping-bag"></i>
                <p>Loading your bag...</p>
            </div>
        </div>

        <div class="cart-summary" id="cartSummary">
            <h3 class="summary-title">Order Summary</h3>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">Rs. 0</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span>FREE</span>
            </div>
            <div class="summary-row">
                <span>Discount</span>
                <span>- Rs. 0</span>
            </div>
            <div class="summary-total">
                <span>Total</span>
                <span id="totalPrice">Rs. 0</span>
            </div>
            <button class="checkout-btn" onclick="handleCheckout()">
                Proceed to Checkout <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadCart();
    });

    async function loadCart() {
        const currentUser = JSON.parse(localStorage.getItem('lomiees_current_user'));
        if (!currentUser) {
            renderCart([]);
            return;
        }

        try {
            const response = await fetch(`/api/cart?username=${currentUser.username}`);
            const data = await response.json();

            if (data.success) {
                renderCart(data.items);
            } else {
                renderCart([]);
            }
        } catch (error) {
            console.error('Load cart error:', error);
            renderCart([]);
        }
    }

    function renderCart(items) {
        const list = document.getElementById('cartItemsList');
        if (!items || items.length === 0) {
            list.innerHTML = `
                <div class="empty-cart">
                    <i class="fas fa-shopping-bag"></i>
                    <h3>Your bag is empty</h3>
                    <p>Looks like you haven't added anything yet.</p>
                    <a href="/" class="shop-btn">Start Shopping</a>
                </div>
            `;
            document.getElementById('cartSummary').style.display = 'none';
            return;
        }

        document.getElementById('cartSummary').style.display = 'block';

        list.innerHTML = items.map(item => {
            const totalPrice = item.price * item.qty;

            return `
                <div class="cart-item">
                    <button class="item-remove-circle" onclick="removeItem(${item.cart_item_id})">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                    <div class="item-image">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="item-info">
                        <div class="item-details">
                            <div class="item-name">${item.name}</div>
                            ${item.size ? `<div class="item-size-badge">Size: ${item.size}</div>` : ''}
                            <div class="item-brand">Lomiees Premium Collection</div>
                        </div>
                        <div class="item-bottom-row">
                            <div class="quantity-picker">
                                <button class="qty-btn" onclick="updateQty(${item.cart_item_id}, -1)">
                                    <i class="fas fa-minus"></i>
                                </button>
                                <span class="qty-val">${item.qty}</span>
                                <button class="qty-btn" onclick="updateQty(${item.cart_item_id}, 1)">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                            <div class="item-price">Rs. ${totalPrice.toLocaleString()}</div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        updateTotal(items);
    }

    async function updateQty(cartItemId, change) {
        const currentUser = JSON.parse(localStorage.getItem('lomiees_current_user'));
        if (!currentUser) return;

        try {
            const response = await fetch('/api/cart/update_qty', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: currentUser.username,
                    cart_item_id: cartItemId,
                    change: change
                })
            });
            const data = await response.json();
            if (data.success) {
                loadCart(); // Refresh the cart
                if (typeof loadCounts === 'function') loadCounts();
            }
        } catch (error) {
            console.error('Update qty error:', error);
        }
    }

    function removeItem(cartItemId) {
        const currentUser = JSON.parse(localStorage.getItem('lomiees_current_user'));
        if (!currentUser) return;

        fetch('/api/cart/remove', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: currentUser.username,
                cart_item_id: cartItemId
            })
        }).then(res => res.json()).then(data => {
            if (data.success) {
                loadCart();
                if (typeof loadCounts === 'function') loadCounts();
            }
        });
    }

    function updateTotal(items) {
        const subtotal = items.reduce((sum, item) => sum + (item.price * item.qty), 0);
        document.getElementById('subtotal').textContent = `Rs. ${subtotal.toLocaleString()}`;
        document.getElementById('totalPrice').textContent = `Rs. ${subtotal.toLocaleString()}`;
    }

    function handleCheckout() {
        window.location.href = '/checkout';
    }
</script>
{% endblock %}
