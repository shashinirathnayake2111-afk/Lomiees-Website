{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/cart.css') }}">
{% endblock %}

{% block content %}
<div class="cart-container">
    <div class="cart-header">
        <h1>Shopping Bag</h1>
        <p>Review your items before checkout</p>
    </div>

    <div class="cart-grid" id="cartGrid">
        <!-- Content will be populated by JS -->
        <div class="cart-items" id="cartItemsList">
            <div class="empty-cart">
                <i class="fas fa-shopping-bag"></i>
                <p>Loading your bag...</p>
            </div>
        </div>

        <div class="cart-summary" id="cartSummary">
            <h3 class="summary-title">Order Summary</h3>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">Rs. 0</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span>FREE</span>
            </div>
            <div class="summary-row">
                <span>Discount</span>
                <span>- Rs. 0</span>
            </div>
            <div class="summary-total">
                <span>Total</span>
                <span id="totalPrice">Rs. 0</span>
            </div>
            <button class="checkout-btn" onclick="handleCheckout()">
                Proceed to Checkout <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadCart();
    });

    async function loadCart() {
        const currentUser = JSON.parse(localStorage.getItem('lomiees_current_user'));
        if (!currentUser) {
            renderCart([]);
            return;
        }

        try {
            const response = await fetch(`/api/cart?username=${currentUser.username}`);
            const data = await response.json();

            if (data.success) {
                renderCart(data.items);
            } else {
                renderCart([]);
            }
        } catch (error) {
            console.error('Load cart error:', error);
            renderCart([]);
        }
    }

    function renderCart(items) {
        const list = document.getElementById('cartItemsList');
        if (!items || items.length === 0) {
            list.innerHTML = `
                <div class="empty-cart">
                    <i class="fas fa-shopping-bag"></i>
                    <h3>Your bag is empty</h3>
                    <p>Looks like you haven't added anything yet.</p>
                    <a href="/" class="shop-btn">Start Shopping</a>
                </div>
            `;
            document.getElementById('cartSummary').style.display = 'none';
            return;
        }

        document.getElementById('cartSummary').style.display = 'block';

        list.innerHTML = items.map(item => {
            const pricePerItem = item.price;
            const totalPrice = pricePerItem * item.qty;

            return `
                <div class="cart-item">
                    <button class="item-remove-circle" onclick="removeItem(${item.id})">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                    <div class="item-image">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-brand">Lomiees Premium</div>
                        <div class="item-controls">
                            <div class="quantity-picker">
                                <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                                <span class="qty-val">${item.qty}</span>
                                <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                    <div class="item-price" style="font-weight: 700;">Rs. ${totalPrice}</div>
                </div>
            `;
        }).join('');

        updateTotal(items);
    }

    async function updateQty(productId, change) {
        const currentUser = JSON.parse(localStorage.getItem('lomiees_current_user'));
        if (!currentUser) return;

        try {
            const response = await fetch('/api/cart/update_qty', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: currentUser.username,
                    product_id: productId,
                    change: change
                })
            });
            const data = await response.json();
            if (data.success) {
                loadCart(); // Refresh the cart
                // Also update the global count if it changed (e.g. item removed)
                if (typeof loadCounts === 'function') loadCounts();
            }
        } catch (error) {
            console.error('Update qty error:', error);
        }
    }

    function removeItem(productId) {
        removeFromCart(productId, () => {
            loadCart();
        });
    }

    function updateTotal(items) {
        const subtotal = items.reduce((sum, item) => sum + (item.price * item.qty), 0);
        document.getElementById('subtotal').textContent = `Rs. ${subtotal}`;
        document.getElementById('totalPrice').textContent = `Rs. ${subtotal}`;
    }

    function handleCheckout() {
        showToast('Processing your order...', 'success');
        setTimeout(() => {
            alert('Checkout functionality would go here!');
        }, 1000);
    }
</script>
{% endblock %}
