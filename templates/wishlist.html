{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/wishlist.css') }}">
{% endblock %}

{% block content %}
<div class="wishlist-page-container">
    <div class="profile-header">
        <h1>My Wishlist</h1>
        <p>Your curated collection of favorite pieces</p>
    </div>

    <div class="wishlist-grid-layout">
        <!-- Sidebar -->
        <div class="profile-sidebar">
            <div class="profile-avatar-wrapper">
                <div class="profile-avatar-huge" id="profilePageAvatar">?</div>
            </div>
            <h2 id="profilePageUsername">Username</h2>
            <p class="email" id="profilePageEmail">user@example.com</p>

            <ul class="sidebar-nav">
                <li><a href="{{ url_for('profile') }}"><i class="fas fa-user-circle"></i> Personal Info</a></li>
                <li><a href="{{ url_for('orders') }}"><i class="fas fa-shopping-bag"></i> My Orders</a></li>
                <li><a href="{{ url_for('settings') }}"><i class="fas fa-cog"></i> Settings</a></li>
                <li><a href="javascript:void(0)" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="wishlist-main">
            <div class="wishlist-items-grid" id="wishlistItems">
                <!-- Sample items for demonstration -->
                <div class="empty-state">
                    <i class="fas fa-heart"></i>
                    <p>Loading your wishlist...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const currentUser = JSON.parse(localStorage.getItem('lomiees_current_user'));

        if (currentUser) {
            const firstLetter = currentUser.username.charAt(0).toUpperCase();
            document.getElementById('profilePageAvatar').textContent = firstLetter;
            document.getElementById('profilePageUsername').textContent = currentUser.username;
            document.getElementById('profilePageEmail').textContent = currentUser.email;
            loadWishlist();
        }
    });

    async function loadWishlist() {
        const currentUser = JSON.parse(localStorage.getItem('lomiees_current_user'));
        if (!currentUser) return;

        try {
            const response = await fetch(`/api/wishlist/items?username=${currentUser.username}`);
            const data = await response.json();
            if (data.success) {
                renderWishlist(data.items);
            } else {
                renderWishlist([]);
            }
        } catch (error) {
            console.error('Load wishlist error:', error);
            renderWishlist([]);
        }
    }

    function renderWishlist(items) {
        const grid = document.getElementById('wishlistItems');
        if (items.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-heart-broken"></i>
                    <h3>Your wishlist is empty</h3>
                    <p>Start adding some favorites!</p>
                    <a href="/" class="shop-now-btn">Explore Collection</a>
                </div>
            `;
            return;
        }

        grid.innerHTML = items.map(item => `
            <div class="wishlist-card">
                <button class="remove-wishlist-btn" title="Remove from wishlist" onclick="removeWishlistItem(${item.id})">
                    <i class="fas fa-times"></i>
                </button>
                <div class="wishlist-card-image">
                    <img src="${item.image}" alt="${item.name}">
                </div>
                <div class="wishlist-card-content">
                    <h3 class="wishlist-card-title">${item.name}</h3>
                    <p class="wishlist-card-price">${item.currentPrice}</p>
                    <button class="add-to-cart-wishlist" onclick="addToCart(${item.id}, this)">
                        <i class="fas fa-shopping-bag"></i> Add to Bag
                    </button>
                </div>
            </div>
        `).join('');
    }

    function removeWishlistItem(productId) {
        removeFromWishlist(productId, () => {
            loadWishlist();
        });
    }
</script>
{% endblock %}
